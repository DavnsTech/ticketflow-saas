<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 520px; margin: 0 auto; padding: 32px; color: #1a1a2e;">
  <h2 style="color: #4f46e5; margin-bottom: 24px;">Verify your email</h2>
  <p>Hi <span th:text="${user.displayName}">User</span>,</p>
  <p>Click the link below to verify your email address:</p>
  <p style="margin: 24px 0;">
    <a th:href="@{|/verify-email?token=${token}|}"
       style="background: #4f46e5; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600;">
      Verify Email
    </a>
  </p>
  <p style="color: #6b7280; font-size: 14px;">If you didn't create an account, ignore this email.</p>
</body>
</html>
